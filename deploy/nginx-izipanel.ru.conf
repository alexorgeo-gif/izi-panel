# Candidate production configuration for the SEO release.
# Install only through the controlled release checklist after staging review.

server {
    listen 80;
    listen [::]:80;
    server_name izipanel.ru www.izipanel.ru;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://izipanel.ru$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.izipanel.ru;

    ssl_certificate /etc/letsencrypt/live/izipanel.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/izipanel.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://izipanel.ru$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name izipanel.ru;

    ssl_certificate /etc/letsencrypt/live/izipanel.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/izipanel.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/izipanel.ru/current;
    index index.html;

    location = /forms.html {
        proxy_pass https://izi-panel.netlify.app/forms.html;
        proxy_ssl_server_name on;
        proxy_ssl_name izi-panel.netlify.app;
        proxy_set_header Host izi-panel.netlify.app;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /_next/static/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    error_page 404 /404.html;

    location = /404.html {
        internal;
    }

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
